<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রসায়ন প্র্যাকটিক্যাল ভাইভা - ডার্ক মোড টেস্ট</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --border-color: #334155;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --success-color: #065f46;
            --success-text: #d1fae5;
            --error-color: #991b1b;
            --error-text: #fee2e2;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        h1 {
            text-align: center;
            color: #60a5fa;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--subtext-color);
            margin-bottom: 25px;
        }

        .progress-container {
            width: 100%;
            background-color: #334155;
            border-radius: 8px;
            height: 10px;
            margin-bottom: 25px;
            overflow: hidden;
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .question-card {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #0f172a;
        }

        .question-title {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.05rem;
            color: #f1f5f9;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            background-color: #1e293b;
            color: var(--text-color);
            transition: all 0.2s;
        }

        .option-label:hover {
            border-color: var(--primary-color);
            background-color: #273548;
        }

        .option-label input {
            margin-right: 12px;
            accent-color: var(--primary-color);
        }

        .explanation {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }

        .explanation.correct {
            background-color: var(--success-color);
            color: var(--success-text);
            border: 1px solid #059669;
        }

        .explanation.incorrect {
            background-color: var(--error-color);
            color: var(--error-text);
            border: 1px solid #dc2626;
        }

        .btn-container {
            text-align: center;
            margin-top: 30px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        #result-section {
            text-align: center;
            margin-top: 25px;
            font-size: 1.2rem;
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .result-highlight {
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .score-details {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .correct-count {
            color: #34d399;
            font-weight: bold;
        }

        .incorrect-count {
            color: #f87171;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>রসায়ন প্র্যাকটিক্যাল ভাইভা টেস্ট</h1>
    <p class="subtitle">লবণ বিশ্লেষণ ও KMnO4 টাইটেশন সংক্রান্ত ৫০টি নির্ভুল প্রশ্ন (ডার্ক মোড)</p>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <form id="quizForm">
        <div id="questionsContainer"></div>

        <div class="btn-container">
            <button type="button" class="btn" id="submitBtn" onclick="submitQuiz()">ফাইনাল স্কোর দেখুন (Submit)</button>
            <button type="button" class="btn" id="retryBtn" onclick="retryQuiz()" style="display: none; background-color: #059669;">পুনরায় চেষ্টা করুন (Retry)</button>
        </div>
    </form>

    <div id="result-section">
        <div class="result-highlight" id="mainScoreText"></div>
        <div class="score-details">
            <div>সঠিক উত্তর: <span class="correct-count" id="totalCorrect">0</span></div>
            <div>ভুল/অনাত্তর: <span class="incorrect-count" id="totalIncorrect">0</span></div>
        </div>
    </div>
</div>

<script>
    const quizData = [
        {
            question: "১. অজৈব লবণের ক্যাটায়ন শনাক্তকরণের জন্য শূন্য গ্রুপে (Zero Group) কোন বিকারক ব্যবহার করা হয়?",
            options: ["নেসলার দ্রবণ", "লঘু HCl", "H2S গ্যাস", "NaOH দ্রবণ"],
            answer: 0,
            explanation: "শূন্য গ্রুপে অ্যামোনিয়াম আয়ন শনাক্ত করার জন্য নেসলার দ্রবণ ব্যবহার করা হয়।"
        },
        {
            question: "২. ১ম গ্রুপের ক্যাটায়ন হিসেবে কোন আয়নটি লঘু HCl যোগ করলে অধঃক্ষিপ্ত হয়?",
            options: ["Cu2+", "Fe3+", "Pb2+", "Al3+"],
            answer: 2,
            explanation: "১ম গ্রুপের গ্রুপ বিকারক লঘু HCl এবং এই গ্রুপে লেড আয়ন ক্লোরাইড লবণ হিসেবে অধঃক্ষিপ্ত হয়।"
        },
        {
            question: "৩. ২য় গ্রুপের ক্যাটায়ন অধঃক্ষিপ্ত করার জন্য মাধ্যমটি কেমন হতে হয়?",
            options: ["অম্লীয় মাধ্যম (HCl যুক্ত)", "ক্ষারীয় মাধ্যম", "সম্পূর্ণ নিরপেক্ষ মাধ্যম", "যেকোনো মাধ্যম"],
            answer: 0,
            explanation: "২য় গ্রুপের ক্যাটায়নসমূহকে H2S গ্যাসের সাহায্যে অধঃক্ষিপ্ত করতে অম্লীয় মাধ্যম প্রয়োজন।"
        },
        {
            question: "৪. ৩য় গ্রুপের গ্রুপ বিকারক হিসেবে নিচের কোনটি ব্যবহৃত হয়?",
            options: ["NH4OH", "NH4Cl + NH4OH", "H2S + HCl", "NaOH"],
            answer: 1,
            explanation: "৩য় গ্রুপের গ্রুপ বিকারক হলো অ্যামোনিয়াম ক্লোরাইড ও অ্যামোনিয়াম হাইড্রোক্সাইডের মিশ্রণ।"
        },
        {
            question: "৫. ৩য় গ্রুপে সাধারণত কোন ক্যাটায়নগুলো হাইড্রোক্সাইড রূপে অধঃক্ষিপ্ত হয়?",
            options: ["Fe3+, Al3+, Cr3+", "Cu2+, Cd2+", "Zn2+, Mn2+", "Ca2+, Ba2+"],
            answer: 0,
            explanation: "৩য় গ্রুপে লোহা, অ্যালুমিনিয়াম এবং ক্রোমিয়াম আয়নসমূহ তাদের হাইড্রোক্সাইড হিসেবে অধঃক্ষিপ্ত হয়।"
        },
        {
            question: "৬. ৪র্থ গ্রুপের গ্রুপ বিকারক হিসেবে কোনটি ব্যবহৃত হয়?",
            options: ["লঘু HCl", "NH4Cl + NH4OH", "(NH4)2CO3", "H2S গ্যাস (ক্ষারীয় মাধ্যমে)"],
            answer: 3,
            explanation: "৪র্থ গ্রুপে অ্যামোনিয়াম ক্লোরাইড ও অ্যামোনিয়াম হাইড্রোক্সাইডের উপস্থিতিতে H2S গ্যাস চালনা করা হয়।"
        },
        {
            question: "৭. ৫ম গ্রুপের গ্রুপ বিকারক কোনটি?",
            options: ["(NH4)2CO3", "Na2CO3", "BaCl2", "K2SO4"],
            answer: 0,
            explanation: "৫ম গ্রুপের ক্যাটায়ন শনাক্তকরণে অ্যামোনিয়াম কার্বনেট ব্যবহার করা হয়।"
        },
        {
            question: "৮. ৬ষ্ঠ গ্রুপে বা অবশিষ্ট গ্রুপে সাধারণত কোন আয়নটি শনাক্ত করা হয়?",
            options: ["Mg2+", "Na+", "K+", "NH4+"],
            answer: 0,
            explanation: "৬ষ্ঠ বা অবশিষ্ট গ্রুপে ম্যাগনেসিয়াম আয়ন শনাক্ত করা হয়।"
        },
        {
            question: "৯. পটাশিয়াম পারম্যাঙ্গানেট ল্যাবরেটরিতে কোন ধরনের পদার্থ হিসেবে পরিচিত?",
            options: ["প্রাইমারি স্ট্যান্ডার্ড পদার্থ", "সেকেন্ডারি স্ট্যান্ডার্ড পদার্থ", "প্রাকৃতিক নির্দেশক", "নিষ্ক্রিয় দ্রাবক"],
            answer: 1,
            explanation: "পটাশিয়াম পারম্যাঙ্গানেট একটি সেকেন্ডারি স্ট্যান্ডার্ড পদার্থ কারণ এটি সহজে বিশুদ্ধ অবস্থায় পাওয়া যায় না।"
        },
        {
            question: "১০. KMnO4 ও FeSO4 টাইটেশনে আলাদাভাবে কোনো নির্দেশক লাগে না কেন?",
            options: ["এটি প্রশমন বিক্রিয়া", "KMnO4 নিজেই একটি স্বয়ং নির্দেশক", "বিক্রিয়কগুলো বর্ণহীন", "নির্দেশক ছাড়া বিক্রিয়া চলে না"],
            answer: 1,
            explanation: "KMnO4 নিজেই তীব্র বেগুনি রঙের হওয়ায় অতিরিক্ত এক ফোঁটা দ্রবণ পড়লেই হালকা গোলাপি বর্ণ ধারণ করে।"
        },
        {
            question: "১১. Fe2+ ও KMnO4 এর টাইটেশনে অম্লীয় মাধ্যম তৈরি করতে কোন এসিড ব্যবহার করা হয়?",
            options: ["লঘু H2SO4", "লঘু HCl", "গাঢ় HNO3", "এসিটিক এসিড"],
            answer: 0,
            explanation: "লঘু সালফিউরিক এসিড ব্যবহার করা হয়। হাইড্রোক্লোরিক এসিড ব্যবহার করা যায় না।"
        },
        {
            question: "১২. KMnO4 টাইটেশনের সমাপ্তি বিন্দুতে দ্রবণের বর্ণ পরিবর্তন কীরূপ হয়?",
            options: ["বর্ণহীন থেকে স্থায়ী হালকা গোলাপি", "হলুদ থেকে গাঢ় নীল", "গোলাপী থেকে বর্ণহীন", "সবুজ থেকে হলুদ"],
            answer: 0,
            explanation: "টাইটেশনের সমাপ্তি বিন্দুতে বর্ণহীন দ্রবণ হালকা গোলাপি বর্ণ ধারণ করে।"
        },
        {
            question: "১৩. প্রাইমারি স্ট্যান্ডার্ড পদার্থের একটি মূল বৈশিষ্ট্য হলো—",
            options: ["বাতাসে এর ওজন পরিবর্তিত হয়", "বিশুদ্ধ অবস্থায় পাওয়া যায় না", "বাতাসে এর ওজন ও রাসায়নিক গঠন অপরিবর্তিত থাকে", "দ্রবণে পলি পড়ে"],
            answer: 2,
            explanation: "প্রাইমারি স্ট্যান্ডার্ড পদার্থ বাতাসে স্থিতিশীল থাকে এবং এর ওজন বা গঠন সহজে পরিবর্তিত হয় না।"
        },
        {
            question: "১৪. অক্সালিক এসিড কোন ধরনের পদার্থ?",
            options: ["প্রাইমারি স্ট্যান্ডার্ড পদার্থ", "সেকেন্ডারি স্ট্যান্ডার্ড পদার্থ", "শক্তিশালী ক্ষার", "লবণ"],
            answer: 0,
            explanation: "অক্সালিক এসিড একটি আদর্শ প্রাইমারি স্ট্যান্ডার্ড পদার্থ।"
        },
        {
            question: "১৫. নেসলার বিকারক দ্বারা কোন আয়নটি নিশ্চিতভাবে শনাক্ত করা হয়?",
            options: ["Na+", "NH4+", "Fe2+", "Cl-"],
            answer: 1,
            explanation: "নেসলার বিকারক যোগ করলে অ্যামোনিয়াম আয়নের উপস্থিতিতে বাদামী বর্ণের অধঃক্ষেপ উৎপন্ন হয়।"
        },
        {
            question: "১৬. ক্লোরাইড আয়ন শনাক্তকরণে কোন বিকারক ব্যবহার করা হয়?",
            options: ["AgNO3 ও লঘু HNO3", "BaCl2 দ্রবণ", "নেসলার বিকারক", "ফেনলফ্যাথ্যালিন"],
            answer: 0,
            explanation: "সিলভার নাইট্রেট ও লঘু নাইট্রিক এসিড যোগ করলে সাদা রঙের সিলভার ক্লোরাইডের অধঃক্ষেপ পড়ে।"
        },
        {
            question: "১৭. সালফেট আয়ন শনাক্তকরণে কোন অধঃক্ষেপ পাওয়া যায়?",
            options: ["সাদা অধঃক্ষেপ", "হলুদ অধঃক্ষেপ", "লাল অধঃক্ষেপ", "নীল অধঃক্ষেপ"],
            answer: 0,
            explanation: "বেরিয়াম ক্লোরাইড দ্রবণ ও লঘু HCl যোগ করলে সালফেট আয়নের উপস্থিতিতে বেরিয়াম সালফেটের সাদা অধঃক্ষেপ পড়ে।"
        },
        {
            question: "১৮. শিখা পরীক্ষায় ক্যালসিয়াম আয়ন কী রঙের শিখা প্রদর্শন করে?",
            options: ["ইট-লাল", "সোনালী হলুদ", "কাঁচা সবুজ", "নিষ্ক্রিয় নীল"],
            answer: 0,
            explanation: "ক্যালসিয়াম আয়ন শিখা পরীক্ষায় ইট-লাল বর্ণ প্রদর্শন করে।"
        },
        {
            question: "১৯. কপার আয়নের সাথে অতিরিক্ত NH4OH যোগ করলে কী রঙের দ্রবণ গঠিত হয়?",

        },

            options: ["কার্বনেট মূলক", "সালফাইড মূলক", "ক্লোরাইড মূলক", "নাইট্রেট মূলক"],

            options: ["পাতিত পানি", "ইথানল", "বেনজিন", "ইথার"],

        }
    ];

    function loadQuiz() {
        const container = document.getElementById('questionsContainer');
        let output = '';

        quizData.forEach((q, index) => {
            output += `
                <div class="question-card" id="q-card-${index}">
                    <div class="question-title">${q.question}</div>
                    <ul class="options-list">
            `;
            q.options.forEach((opt, optIndex) => {
                output += `
                    <li class="option-item">
                        <label class="option-label">
                            <input type="radio" name="question-${index}" value="${optIndex}" onchange="handleOptionSelect(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });
            output += `
                    </ul>
                    <div class="explanation" id="explanation-${index}"></div>
                </div>
            `;
        });

        container.innerHTML = output;
        updateProgress();
    }

    function handleOptionSelect(qIndex, selectedOptIndex) {
        const q = quizData[qIndex];
        const explanationDiv = document.getElementById(`explanation-${qIndex}`);
        const isCorrect = selectedOptIndex === q.answer;

        explanationDiv.style.display = 'block';
        if (isCorrect) {
            explanationDiv.className = 'explanation correct';
            explanationDiv.innerHTML = `সঠিক! ${q.explanation}`;
        } else {
            explanationDiv.className = 'explanation incorrect';
            explanationDiv.innerHTML = `ভুল! সঠিক উত্তর: "${q.options[q.answer]}" — ${q.explanation}`;
        }

        updateProgress();
    }

    function updateProgress() {
        let answeredCount = 0;
        quizData.forEach((_, index) => {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            if (selected) {
                answeredCount++;
            }
        });
        const progressPercentage = (answeredCount / quizData.length) * 100;
        document.getElementById('progressBar').style.width = progressPercentage + '%';
    }

    function submitQuiz() {
        let correctCount = 0;
        let incorrectCount = 0;

        quizData.forEach((q, index) => {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            if (selected) {
                if (parseInt(selected.value) === q.answer) {
                    correctCount++;
                } else {
                    incorrectCount++;
                }
            } else {
                incorrectCount++; // unanswered counted as incorrect/unattempted
            }

            // Disable inputs after submission
            const inputs = document.querySelectorAll(`input[name="question-${index}"]`);
            inputs.forEach(input => input.disabled = true);
        });

        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('retryBtn').style.display = 'inline-block';

        // Display results
        const percentage = ((correctCount / quizData.length) * 100).toFixed(1);
        document.getElementById('mainScoreText').innerHTML = `আপনার ফাইনাল স্কোর: ${correctCount} / ${quizData.length} (${percentage}%)`;
        document.getElementById('totalCorrect').innerText = correctCount;
        document.getElementById('totalIncorrect').innerText = incorrectCount;
        
        document.getElementById('result-section').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function retryQuiz() {
        loadQuiz();
        document.getElementById('submitBtn').style.display = 'inline-block';
        document.getElementById('retryBtn').style.display = 'none';
        document.getElementById('result-section').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = loadQuiz;
</script>
